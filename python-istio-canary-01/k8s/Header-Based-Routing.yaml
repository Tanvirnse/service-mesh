# ... (Gateway and DestinationRule are unchanged) ...
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: python-app-vs
  namespace: istio-test
spec:
  hosts:
  - "*"
  gateways:
  - python-app-header-gateway
  http:
  - match:
    - headers:
        # If this header is present...
        end-user:
          exact: tester
    route:
    # ...send traffic to v2
    - destination:
        host: python-app-service
        subset: v2
  - route:
    # For ALL other traffic, send to v1
    - destination:
        host: python-app-service
        subset: v1

# curl -k -H "Host: exp8.osl.team" -H "end-user: tester" https://exp8.osl.team
# curl -k -H "Host: exp8.osl.team" https://exp8.osl.team