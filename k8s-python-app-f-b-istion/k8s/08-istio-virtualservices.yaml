apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: frontend-vs
  namespace: istio-apps
spec:
  hosts:
  - "*"
  gateways:
  - app-gateway
  http:
  - route:
    - destination:
        host: frontend-service
        port:
          number: 5000
      # Route 75% of traffic to v1 and 25% to v2
      weight: 75
    - destination:
        host: frontend-service
        port:
          number: 5000
        subset: v2
      weight: 25
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: backend-vs
  namespace: istio-apps
spec:
  hosts:
  - backend-service.istio-apps.svc.cluster.local # The internal k8s FQDN
  http:
  - match:
    - headers:
        x-app-version: # This header is set by the frontend app
          exact: "v2"
    route:
    - destination:
        host: backend-service
        subset: v2
  # Default route for all other traffic
  - route:
    - destination:
        host: backend-service
        subset: v1