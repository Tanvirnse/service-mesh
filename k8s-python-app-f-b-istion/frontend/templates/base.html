<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Istio Demo App - {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/page2">Page 2</a> |
        <a href="/page3">Page 3</a> |
        <a href="/page4">Page 4</a> |
        <a href="/page5">Page 5</a>
    </nav>
    <div class="container">
        <h1>{{ title }}</h1>
        <div class="info-box">
            <h2>Frontend Info</h2>
            <p><strong>Serving Pod:</strong> {{ pod_name }}</p>
            <p><strong>App Version:</strong> {{ app_version }}</p>
            <p><strong>Page Load Time (Browser):</strong> <span id="load-time"></span> ms</p>
        </div>
        
        {% block content %}{% endblock %}

    </div>
    <script>
        window.onload = function () {
            // Using Navigation Timing API to get a more accurate client-side load time
            setTimeout(function () {
                const timing = window.performance.timing;
                const loadTime = timing.loadEventEnd - timing.navigationStart;
                document.getElementById('load-time').textContent = loadTime;
            }, 0);
        };
    </script>
</body>
</html>
